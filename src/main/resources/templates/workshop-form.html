
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workshop Form</title>
</head>
<body>

<h1 th:text="${workshop == null ? 'Add Workshop' : 'Edit Workshop'}">
    Workshop Form
</h1>

<form th:action="${workshop == null}
        ? @{/workshops/add}
        : @{/workshops/edit/{id}(id=${workshop.id})}"
      method="post">

    <label>Title:</label>
    <input type="text" name="title"
           th:value="${workshop != null ? workshop.title : ''}"
           required>
    <br><br>

    <label>Category:</label>
    <input type="text" name="category"
           th:value="${workshop != null ? workshop.category : ''}"
           required>
    <br><br>

    <label>Price:</label>
    <input type="number" name="price"
           min="0" step="0.01"
           th:value="${workshop != null ? workshop.price : ''}"
           required>
    <br><br>

    <label>Capacity:</label>
    <input type="number" name="capacity"
           min="0"
           th:value="${workshop != null ? workshop.capacity : ''}"
           required>
    <br><br>

    <label>Instructor:</label>
    <select name="instructorId" required>
        <option value="">Select instructor</option>

        <option th:each="instructor : ${instructors}"
                th:value="${instructor.id}"
                th:text="${instructor.name + ' ' + instructor.surname}"
                th:selected="${workshop != null and workshop.instructor.id == instructor.id}">
        </option>
    </select>

    <br><br>

    <button type="submit"
            th:text="${workshop == null ? 'Add Workshop' : 'Save Changes'}">
        Submit
    </button>

</form>

<br>

<a th:href="@{/workshops}">Back to Workshops</a>

</body>
</html>
